<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#favicon-grad)" stroke-width="6" opacity="0.8" filter="url(#glow)" />
  
  <!-- Inner coding braces & AI Sparkle -->
  <path d="M 38 35 L 25 50 L 38 65" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 62 35 L 75 50 L 62 65" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sparkle center symbol -->
  <path d="M 50 38 L 50 62 M 38 50 L 62 50" fill="none" stroke="url(#favicon-grad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>